name: AMOLED Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download test files
        run: |
          curl -fL --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.4.0/morphe-desktop-2.4.0-all.jar \
            -o morphe-desktop.jar

          curl -fL --retry 3 \
            https://f-droid.org/repo/proton.android.pass.fdroid_14105000.apk \
            -o proton-pass.apk

          curl -fL --retry 3 \
            https://github.com/thunderbird/thunderbird-android/releases/download/THUNDERBIRD_25_0/thunderbird-25.0.apk \
            -o thunderbird.apk

      - name: Verify compatibility
        run: |
          bash scripts/verify-apk.sh \
            proton-pass proton-pass.apk morphe-desktop.jar

          bash scripts/verify-apk.sh \
            thunderbird thunderbird.apk morphe-desktop.jar

      - name: Build and test MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

          MPP=$(find patches/build/libs -maxdepth 1 -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*')
          test "$(printf '%s\\n' "$MPP" | grep -c .)" -eq 1

          for app in proton-pass thunderbird; do
            java -jar morphe-desktop.jar patch "$app.apk" \
              --patches="$MPP" \
              --out="$app-patched.apk" \
              --result-file="$app-result.json" \
              --validate --unsigned

            case "$app" in
              proton-pass)
                PKG=proton.android.pass.fdroid
                VER=1.41.5
                ;;
              thunderbird)
                PKG=net.thunderbird.android
                VER=25.0
                ;;
            esac

            jq -e --arg p "$PKG" --arg v "$VER" '
              .success == true and
              .packageName == $p and
              .packageVersion == $v and
              .appliedPatches == ["Pure AMOLED"] and
              .failedPatches == [] and
              all(.stepResults[]; .success == true)
            ' "$app-result.json"

            test -s "$app-patched.apk"
            echo "PASS: $app"
          done
