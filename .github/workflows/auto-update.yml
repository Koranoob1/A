name: Automatic App Update Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  issues: write

concurrency:
  group: amoled-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Detect and verify updates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://f-droid.org/api/v1/packages/proton.android.pass.fdroid \
            -o proton.json

          PASS_CODE=$(jq -er '.suggestedVersionCode' proton.json)

          PASS=$(jq -er --argjson c "$PASS_CODE" \
            '.packages[] | select(.versionCode == $c) | .versionName' \
            proton.json)

          gh api 'repos/thunderbird/thunderbird-android/releases?per_page=100' \
            > thunderbird.json

          TB_URL=$(jq -er '
            [.[] | select(
              .draft == false and
              .prerelease == false and
              (.tag_name | startswith("THUNDERBIRD_"))
            )][0].assets[] |
            select(.name | test("^thunderbird-[0-9.]+\\.apk$")) |
            .browser_download_url
          ' thunderbird.json)

          TB=$(basename "$TB_URL" |
            sed -nE 's/^thunderbird-([0-9.]+)\.apk$/\1/p')

          test -n "$TB"

          test "$(jq -er '.version' patches-list.json)" = \
            "$(jq -er '.version' patches-bundle.json)"

          check_app() {
            local app="$1"
            local package="$2"
            local version="$3"
            local url="$4"

            echo "$app: $version"

            local supported
            supported=$(jq -r --arg p "$package" --arg v "$version" \
              'any(.patches[].compatiblePackages[]?;
                .packageName == $p and
                any(.targets[]?; .version == $v))' \
              patches-list.json)

            if [ "$supported" = true ]; then
              echo "Already supported"
              return
            fi

            echo "NEW VERSION DETECTED"

            if [ ! -f morphe-desktop.jar ]; then
              curl -fL --retry 3 \
                https://github.com/MorpheApp/morphe-desktop/releases/download/v2.4.0/morphe-desktop-2.4.0-all.jar \
                -o morphe-desktop.jar
            fi

            curl -fL --retry 3 "$url" -o "$app.apk"

            if bash scripts/verify-apk.sh \
              "$app" "$app.apk" morphe-desktop.jar; then
              printf '%s\\t%s\\t%s\\n' "$app" "$package" "$version" >> candidates.tsv
              echo "Candidate accepted"
              return
            else
              STATUS="Manual review required"
            fi

            TITLE="$app $version compatibility review"

            COUNT=$(gh issue list --state open \
              --limit 1000 --json title \
              --jq '.' |
              jq --arg t "$TITLE" \
              '[.[] | select(.title == $t)] | length')

            if [ "$COUNT" = 0 ]; then
              gh issue create \
                --title "$TITLE" \
                --body "$STATUS. Upstream version: $version"
            fi

            echo "$STATUS"
          }

          check_app proton-pass \
            proton.android.pass.fdroid "$PASS" \
            "https://f-droid.org/repo/proton.android.pass.fdroid_${PASS_CODE}.apk"

          check_app thunderbird \
            net.thunderbird.android "$TB" "$TB_URL"

      - name: Publish compatible updates
        run: |
          if [ -s candidates.tsv ]; then
            bash scripts/publish-auto.sh
          else
            echo "No compatible updates to publish"
          fi

      - name: Report automation failure
        if: failure()
        run: |
          TITLE="Automatic update pipeline failure"
          COUNT=$(gh issue list --state open --json title |
            jq --arg t "$TITLE" '[.[] | select(.title == $t)] | length')
          if [ "$COUNT" = 0 ]; then
            gh issue create --title "$TITLE" \
              --body "Check Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
