name: Release AMOLED Patches

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          cp patches/build/libs/*.mpp "patches-$VERSION.mpp"
          gh release create "v$VERSION" \
            "patches-$VERSION.mpp" \
            patches-list.json \
            --title "AMOLED Patches $VERSION" \
            --generate-notes
