name: Release AMOLED Patches

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: amoled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 1
          fi
          sed -i "s/^version = .*/version = \"$VERSION\"/" patches/build.gradle.kts

      - name: Prepare description
        run: |
          DESCRIPTION=$(python3 scripts/update-docs.py --prepare)
          echo "DESCRIPTION=$DESCRIPTION" >> "$GITHUB_ENV"

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Verify MPP
        run: |
          MPP=$(find patches/build/libs -maxdepth 1 -name "*.mpp" ! -name "*sources*" ! -name "*javadoc*" | sort)
          test "$(printf "%s\n" "$MPP" | grep -c .)" -eq 1
          cp "$MPP" "patches-$VERSION.mpp"
          unzip -p "patches-$VERSION.mpp" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx "Version: $VERSION"

      - name: Verify description
        run: |
          python3 - <<'VERIFY'
          import os
          import zipfile
          with zipfile.ZipFile("patches-" + os.environ["VERSION"] + ".mpp") as z:
              m = z.read("META-INF/MANIFEST.MF").decode()
              m = m.replace("\r\n", "\n").replace("\n ", "")
              assert "Description: " + os.environ["DESCRIPTION"] in m.splitlines()
          print("PASS: Description verified")
          VERIFY

      - name: Update bundle and source
        run: |
          jq -n \
            --arg description "$DESCRIPTION" \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/patches-$VERSION.mpp" \
            '{created_at:$date,description:$description,download_url:$url,signature_download_url:"",version:$version}' \
            > patches-bundle.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/update-docs.py
          git add patches/build.gradle.kts patches-bundle.json README.md
          git add -f patches-list.json
          git commit -m "Release AMOLED Patches $VERSION"

          git archive --format=zip \
            --output="AMOLED-Patches-$VERSION-source.zip" HEAD

      - name: Publish release
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" \
            "patches-$VERSION.mpp" \
            patches-list.json \
            "AMOLED-Patches-$VERSION-source.zip" \
            --verify-tag \
            --title "AMOLED Patches $VERSION" \
            --notes "Updated Morphe bundle description and release automation. Existing AMOLED patches and supported app versions are unchanged."

          git push origin HEAD:main
